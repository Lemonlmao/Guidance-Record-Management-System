name: Build and security tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run Java, SQL, and HTTP security checks
        shell: pwsh
        run: ./test.ps1
      - name: Check browser script syntax and repository contents
        shell: pwsh
        run: |
          node --check src/main/resources/public/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-repository.mjs
